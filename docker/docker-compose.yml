# Serving stack: the model server only, plus an on-demand training profile.
#
# There is no MLflow tracking service: training logs to the local SQLite
# state directory (./mlflow-state, see src/config.py), and serving never
# contacts MLflow - the exported pyfunc model is baked into the image and
# inference requests are logged to a local JSON file.
#
# The `train` service runs the pipeline and the export step, so after a
# training run ./models/model and ./artifacts/drift_baseline_stats.json
# exist on the host and the model-serve image can be rebuilt:
#
#   docker compose -f docker/docker-compose.yml run --rm train
#   docker compose -f docker/docker-compose.yml build model-serve
#   docker compose -f docker/docker-compose.yml up -d
#
# The MLflow state (run history + model registry) persists in the
# mlflow-state volume across training runs.

services:
  model-serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile.model-serve
    ports:
      - "5001:5001"

  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    volumes:
      - mlflow-state:/app/mlflow-state
      - ../models:/app/models
      - ../artifacts:/app/artifacts
    profiles:
      - train

volumes:
  mlflow-state:
